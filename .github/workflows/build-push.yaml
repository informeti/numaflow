name: build-push

on:
  push:
    branches: [rolling]
    tags: ["v*"]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/numaflow
  REF: ${{ inputs.ref || github.ref }}
  TAG: ${{ inputs.ref || (github.ref_type == 'tag' && github.ref_name) || 'latest' }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          if [[ "$TAG" != latest && "$TAG" != v*-"$GITHUB_REPOSITORY_OWNER".* ]]; then
            echo "::error::release tag must end in -$GITHUB_REPOSITORY_OWNER.<revision>"
            exit 1
          fi
          upstream="${TAG%%-*}"
          git_tag=
          [[ "$TAG" == latest ]] || git_tag="$TAG"
          docker build \
            --platform linux/${{ matrix.arch }} \
            --build-arg UPSTREAM_IMAGE="quay.io/numaproj/numaflow:$upstream" \
            --build-arg VERSION="$TAG" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --build-arg GIT_COMMIT="$(git rev-parse HEAD)" \
            --build-arg GIT_TAG="$git_tag" \
            -t "$IMAGE:$TAG-${{ matrix.arch }}" \
            -f Containerfile \
            .
          docker push "$IMAGE:$TAG-${{ matrix.arch }}"

  manifest:
    name: Push combined manifest
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create and push combined manifest
        run: |
          docker manifest create "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
          docker manifest push "$IMAGE:$TAG"
